{% extends "base.html" %}
{% block title %}Giriş — GüvercinIhale{% endblock %}

{% block content %}
<div class="auth-page" x-data="loginForm()">
    <div class="auth-card">
        <h2>Giriş Yap</h2>
        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" x-model="username" required>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" x-model="password" required>
            </div>
            <p x-show="error" x-text="error" class="form-error"></p>
            <button type="submit" class="btn btn-full" :disabled="loading">
                <span x-show="!loading">Giriş Yap</span>
                <span x-show="loading">Yükleniyor...</span>
            </button>
        </form>
        <p class="auth-link">Hesabın yok mu? <a href="/kayit">Kayıt ol</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loginForm() {
    return {
        username: '', password: '', error: '', loading: false,
        async submit() {
            this.loading = true; this.error = '';
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: this.username, password: this.password})
                });
                const data = await res.json();
                if (!res.ok) { this.error = data.detail; return; }
                localStorage.setItem('token', data.access_token);
                window.location.href = '/';
            } catch(e) { this.error = 'Bağlantı hatası.'; }
            finally { this.loading = false; }
        }
    }
}
</script>
{% endblock %}
