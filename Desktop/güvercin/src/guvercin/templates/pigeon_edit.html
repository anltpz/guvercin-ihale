{% extends "base.html" %}
{% block title %}İlan Düzenle — GüvercinIhale{% endblock %}

{% block content %}
<div class="auth-page" x-data="pigeonEditForm({{ pigeon_id }})">
    <div class="auth-card" style="max-width: 520px">
        <h2>Güvercin İlanı Düzenle</h2>
        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="name">İsim *</label>
                <input type="text" id="name" x-model="name" required minlength="2">
            </div>
            <div class="form-group">
                <label for="breed">Cins *</label>
                <input type="text" id="breed" x-model="breed" required minlength="2">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="age">Yaş</label>
                    <input type="number" id="age" x-model.number="age" min="0" max="30">
                </div>
                <div class="form-group">
                    <label for="gender">Cinsiyet</label>
                    <select id="gender" x-model="gender">
                        <option value="">Seçiniz</option>
                        <option value="erkek">Erkek</option>
                        <option value="disi">Dişi</option>
                        <option value="bilinmiyor">Bilinmiyor</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="color">Renk</label>
                    <input type="text" id="color" x-model="color">
                </div>
                <div class="form-group">
                    <label for="weight">Ağırlık (kg)</label>
                    <input type="number" id="weight" x-model.number="weight_kg" min="0" max="5" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label for="photo_url">Fotoğraf URL</label>
                <input type="url" id="photo_url" x-model="photo_url">
            </div>
            <div class="form-group">
                <label for="description">Açıklama</label>
                <textarea id="description" x-model="description" rows="3"></textarea>
            </div>
            <p x-show="error" x-text="error" class="form-error"></p>
            <p x-show="success" class="form-success">İlan güncellendi!</p>
            <button type="submit" class="btn btn-full" :disabled="loading">
                <span x-show="!loading">Kaydet</span>
                <span x-show="loading">Yükleniyor...</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function pigeonEditForm(pigeonId) {
    return {
        name: '', breed: '', age: null, gender: '', color: '', weight_kg: null,
        photo_url: '', description: '',
        error: '', success: false, loading: false,
        async init() {
            const res = await fetch(`/pigeons/${pigeonId}`);
            if (res.ok) {
                const p = await res.json();
                this.name = p.name; this.breed = p.breed;
                this.age = p.age; this.gender = p.gender || '';
                this.color = p.color || ''; this.weight_kg = p.weight_kg;
                this.photo_url = p.photo_url || ''; this.description = p.description || '';
            }
        },
        async submit() {
            this.loading = true; this.error = ''; this.success = false;
            const token = localStorage.getItem('token');
            if (!token) { this.error = 'Giriş yapmanız gerekli.'; this.loading = false; return; }
            try {
                const res = await fetch(`/pigeons/${pigeonId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify({
                        name: this.name, breed: this.breed,
                        age: this.age || null, gender: this.gender || null,
                        color: this.color || null, weight_kg: this.weight_kg || null,
                        photo_url: this.photo_url || null, description: this.description || null
                    })
                });
                const data = await res.json();
                if (!res.ok) { this.error = data.detail; return; }
                this.success = true;
            } catch(e) { this.error = 'Bağlantı hatası.'; }
            finally { this.loading = false; }
        }
    }
}
</script>
{% endblock %}
