{% extends "base.html" %}
{% block title %}İhaleler — GüvercinIhale{% endblock %}

{% block content %}
<section x-data="auctionList()">
    <div class="page-header">
        <h1>Aktif İhaleler</h1>
    </div>

    <div class="card-grid">
        <template x-for="a in auctions" :key="a.id">
            <a :href="'/ihale/' + a.id" class="auction-card">
                <div class="auction-status">Aktif</div>
                <div class="auction-info">
                    <span class="auction-id" x-text="'İhale #' + a.id"></span>
                    <span class="auction-pigeon" x-text="'Güvercin #' + a.pigeon_id"></span>
                    <span class="auction-duration" x-text="a.duration_seconds + ' sn'"></span>
                </div>
            </a>
        </template>
        <p x-show="auctions.length === 0" class="empty-state">Henüz aktif ihale yok.</p>
    </div>

    <div class="pagination" x-show="auctions.length >= limit">
        <button class="btn btn-sm" @click="prev()" :disabled="skip === 0">Önceki</button>
        <button class="btn btn-sm" @click="next()">Sonraki</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function auctionList() {
    return {
        auctions: [], skip: 0, limit: 12,
        async init() { await this.load(); },
        async load() {
            const res = await fetch(`/auctions/?skip=${this.skip}&limit=${this.limit}`);
            this.auctions = await res.json();
        },
        async next() { this.skip += this.limit; await this.load(); },
        async prev() { this.skip = Math.max(0, this.skip - this.limit); await this.load(); }
    }
}
</script>
{% endblock %}
