services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guvercin
      POSTGRES_USER: guvercin
      POSTGRES_PASSWORD: guvercin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guvercin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://guvercin:guvercin123@db:5432/guvercin
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      PAYMENT_PROVIDER: stub
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn guvercin.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
