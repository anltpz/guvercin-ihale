name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bağımlılıkları yükle
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Black format kontrolü
        run: black --check .

      - name: Testler ve coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          PAYMENT_PROVIDER: "stub"
          CORS_ORIGINS: "http://localhost:8000"
        run: pytest --cov=src/guvercin --cov-report=term-missing --cov-fail-under=80
